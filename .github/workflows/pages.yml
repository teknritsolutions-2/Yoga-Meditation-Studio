name: Publish static Sola Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare runtime files only
        run: |
          mkdir -p "$RUNNER_TEMP/sola-public"
          cp index.html "$RUNNER_TEMP/sola-public/"
          cp -R pages assets "$RUNNER_TEMP/sola-public/"
          touch "$RUNNER_TEMP/sola-public/.nojekyll"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/sola-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
